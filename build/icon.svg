<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Kinoshift</title>
  <defs>
    <!-- Dégradé très discret, comme les icônes Apple : un seul aplat vivant -->
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ea3fa6"/>
      <stop offset="1" stop-color="#c01884"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4d0a33" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fond : carré arrondi Apple -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Glyphe : double lecture = mouvement (shift), à plat -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="44" stroke-linejoin="round">
    <path d="M322 377 V647 L472 512 Z" opacity="0.4"/>
    <path d="M552 377 V647 L702 512 Z"/>
  </g>
</svg>
